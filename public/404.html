<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not here &middot; Mohamed Hamlil</title>
<link rel="icon" href="/site/favicon.svg" type="image/svg+xml">
<!-- Served for any missing path on this domain, at any depth, so relative asset
     paths would resolve against whatever was requested. Hence inline styles. -->
<style>
  :root { color-scheme: light dark; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    background: #F4F6F9; color: #0F1B2A; text-align: center; padding: 2rem;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.6;
  }
  @media (prefers-color-scheme: dark) { body { background: #0B131E; color: #E7EEF6; } }
  h1 { font-size: 1.8rem; letter-spacing: -0.03em; margin: 0 0 .4rem; }
  p { color: #5A6B80; max-width: 46ch; margin: 0 auto 1.6rem; }
  @media (prefers-color-scheme: dark) { p { color: #93A5BA; } }
  code { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: .85em; word-break: break-all; }
  a { color: #10707E; font-weight: 600; text-underline-offset: 3px; }
  @media (prefers-color-scheme: dark) { a { color: #4FC3D0; } }
  .bars { display: grid; gap: 6px; width: 120px; margin: 0 auto 1.6rem; }
  .bars i { height: 10px; border-radius: 3px; background: #D7DEE7; display: block; }
  @media (prefers-color-scheme: dark) { .bars i { background: #233346; } }
  .bars i:nth-child(1) { width: 100%; }
  .bars i:nth-child(2) { width: 62%; }
  .bars i:nth-child(3) { width: 0; outline: 1px dashed #B4820E; outline-offset: 2px; }
</style>
</head>
<body>
  <main>
    <div class="bars" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Reduced to nothing.</h1>
    <p>There is no page at <code id="path"></code>.</p>
    <p><a href="/">Back to the start</a></p>
  </main>
  <script>document.getElementById('path').textContent = location.pathname;</script>
</body>
</html>
